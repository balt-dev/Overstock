[manifest]
version = "1.0.0"
priority = 0

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = """
    G.CONTROLLER.locks.shop_reroll = false
"""
position = "at"
payload = '''
if not G.GAME.overstock_rerolling then
    G.CONTROLLER.locks.shop_reroll = false
end
'''
match_indent = true
times = 1